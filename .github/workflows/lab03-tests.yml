name: Lab03 - testes

on:
  push:
    paths:
      - "Laboratorio3/**"
      - ".github/workflows/lab03-tests.yml"
  pull_request:
    paths:
      - "Laboratorio3/**"
      - ".github/workflows/lab03-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Laboratorio3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Laboratorio3/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: pytest
