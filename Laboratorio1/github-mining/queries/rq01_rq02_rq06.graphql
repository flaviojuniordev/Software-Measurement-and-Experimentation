# Lab01 — Flavio de Souza Ferreira Jr e Luidi Cadete
# RQs cobertas nesta query:
#   RQ01 → createdAt
#   RQ02 → pullRequests(states: MERGED).totalCount
#   RQ03 → releases.totalCount
#   RQ04 → updatedAt
#   RQ05 → primaryLanguage.name
#   RQ06 → issues.totalCount + issues(states: CLOSED).totalCount
#
# Variáveis:
#   $first: tamanho da página (5–10 na validação; até 100 por página na coleta S02).
#   $after: cursor da próxima página.
# Ordenação: repositórios públicos com mais estrelas.

query PopularReposRQ01RQ02RQ03RQ04RQ05RQ06($first: Int!, $after: String, $includeReleases: Boolean!) {
  search(query: "stars:>1 sort:stars-desc", type: REPOSITORY, first: $first, after: $after) {
    repositoryCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on Repository {
        nameWithOwner
        url
        stargazerCount

        # RQ01 — idade (calculada depois a partir de createdAt)
        createdAt

        # RQ02 — contribuição externa (PRs aceitas)
        mergedPullRequests: pullRequests(states: MERGED) {
          totalCount
        }

        # RQ03 — total de releases
        releases(first: 1) @include(if: $includeReleases) {
          totalCount
        }

        # RQ04 — data da última atualização
        updatedAt

        # RQ05 — linguagem primária
        primaryLanguage {
          name
        }

        # RQ06 — percentual de issues fechadas
        # (razão = closed / total; calculada depois pelo script)
        issues {
          totalCount
        }
        closedIssues: issues(states: CLOSED) {
          totalCount
        }
      }
    }
  }
}
